<section class="comments">
	<div class="divider"></div>
	<h2 class="comments-title">Coment&aacute;rios</h2>
	<div class="giscus"></div>
</section>

<script>
(function () {
	function currentTheme() {
		return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
	}

	var s = document.createElement('script');
	s.src = 'https://giscus.app/client.js';
	s.setAttribute('data-repo', 'Gutem/gutem.github.io');
	s.setAttribute('data-repo-id', 'MDEwOlJlcG9zaXRvcnk0NDU2MjU3Nw==');
	s.setAttribute('data-category', 'Announcements');
	s.setAttribute('data-category-id', 'DIC_kwDOAqf4kc4DAgHB');
	s.setAttribute('data-mapping', 'pathname');
	s.setAttribute('data-strict', '0');
	s.setAttribute('data-reactions-enabled', '1');
	s.setAttribute('data-emit-metadata', '0');
	s.setAttribute('data-input-position', 'bottom');
	s.setAttribute('data-theme', currentTheme());
	s.setAttribute('data-lang', 'pt');
	s.crossOrigin = 'anonymous';
	s.async = true;
	document.querySelector('.giscus').appendChild(s);

	window.addEventListener('themechange', function () {
		var frame = document.querySelector('iframe.giscus-frame');
		if (frame) {
			frame.contentWindow.postMessage(
				{ giscus: { setConfig: { theme: currentTheme() } } },
				'https://giscus.app'
			);
		}
	});
})();
</script>
